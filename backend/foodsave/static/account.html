<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>食在可惜｜帳號刪除</title><link rel="stylesheet" href="/admin.css"><script src="/account.js" defer></script></head><body><header><strong>食在可惜</strong><span>帳號刪除與查詢</span></header><main><section id="login-card"><h1>管理你的刪除申請</h1><p>即使App已登出或遺失回覆，也可使用原帳號密碼查詢。密碼只用於本次身分確認，不保存在此頁。</p><p id="privacy">正在載入營運者說明…</p><form id="account-form"><label>電子郵件<input name="email" type="email" required autocomplete="username"></label><label>密碼<input name="password" type="password" required minlength="12" maxlength="128" autocomplete="current-password"></label><label><input type="checkbox" name="confirm"> 我要送出刪除申請，並停用帳號</label><p>送出後會撤銷登入、取消本人待領取預約並返還庫存；商家商品會關閉。受理不代表已完成資料清除，最終清除須依營運者保存政策處理。</p><button name="action" value="status">查詢處理狀態</button><button name="action" value="submit">送出刪除申請</button></form><p id="status" role="status" aria-live="polite"></p></section></main></body></html>
