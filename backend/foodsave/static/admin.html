<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>食在可惜｜管理中心</title><link rel="stylesheet" href="/admin.css"><script src="/admin.js" defer></script></head><body>
<header><strong>食在可惜</strong><span>管理中心</span><button id="logout" hidden>登出</button></header>
<main><section id="login-card"><h1>管理員登入</h1><p>使用獨立管理帳號，查看營運資料與設定獎勵。</p><form id="login"><label>電子郵件<input name="email" type="email" autocomplete="username" required></label><label>密碼<input name="password" type="password" autocomplete="current-password" minlength="12" maxlength="128" required></label><button>登入</button></form></section>
<p id="status" role="status" aria-live="polite"></p>
<section id="workspace" hidden><div class="layout"><aside><h2>資料查看</h2><label>資料表<select id="table"><option value="products">商品庫存</option><option value="reservations">預約</option><option value="stores">店家</option><option value="users">帳號狀態</option><option value="prizes">獎品</option><option value="spin_grants">抽獎次數</option><option value="draws">抽獎紀錄</option><option value="audit_logs">操作紀錄</option></select></label><button id="refresh">重新載入</button><p>此檢視只提供允許的欄位，不顯示密碼、會話或兌換碼。</p><h2>例行整理</h2><button id="maintenance">整理逾期與上週排名</button><p>可重試；免費主機休眠時不會自動執行。</p><h2>營運設定</h2><label>操作<select id="operation"><option value="prizes">新增獎品</option><option value="spin-grants">發放抽獎次數</option><option value="stores">新增店家</option><option value="exp-rules">EXP 規則</option></select></label><p>僅填入已核准的真實獎品、來源與數值。</p></aside><article><h1>營運資料</h1><div class="table-scroll"><table id="data"></table></div><div class="pager"><button id="prev">上一頁</button><span id="page">第 1 頁</span><button id="next">下一頁</button></div></article><section class="editor"><h2 id="edit-title">新增獎品</h2><form id="editor"><div id="fields"></div><button type="submit">儲存設定</button></form><p class="hint">網路錯誤後請保留本頁並重試；相同內容會沿用同一操作識別碼，避免重複發放。</p></section></div></section></main></body></html>
