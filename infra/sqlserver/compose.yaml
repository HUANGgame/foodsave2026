# Isolated, disposable compatibility test database. Never use for production.
name: foodsave-sql-test
services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${FOODSAVE_TEST_DB_PASSWORD:?Use the private temporary env file described in README.md}
    ports:
      - "127.0.0.1:14339:1433"
    healthcheck:
      test:
        - CMD-SHELL
        - 'SQLCMDPASSWORD="$$MSSQL_SA_PASSWORD" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -Q "SELECT 1" -b -o /dev/null'
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    # No host data mount, external network, persistent volume, or restart policy.
    # Data survives stop/start but is discarded when this container is removed.
