# Manual test-database rehearsal. Save-only until the exact definition is authorized.
# runRollback defaults false. Missing runner/tests fail closed; never fall back.
trigger: none
pr: none
parameters:
- name: runRollback
  type: boolean
  default: false
pool:
  vmImage: ubuntu-24.04
jobs:
- job: RehearsePopulatedUpgrade
  displayName: Rehearse populated upgrade in foodsave-validation-20261006 only
  timeoutInMinutes: 15
  cancelTimeoutInMinutes: 1
  condition: and(eq(variables['Build.Reason'], 'Manual'), eq(variables['Build.SourceBranch'], 'refs/heads/foodsave-azure-checks-20261008'))
  steps:
  - checkout: self
    clean: true
    fetchDepth: 0
    persistCredentials: false
    submodules: false
    lfs: false
  - bash: |
      set -euo pipefail
      git merge-base --is-ancestor 309df1b9613277ac7073bfb76665c31096eb811c HEAD
      test -z "$(git diff --name-only 309df1b9613277ac7073bfb76665c31096eb811c HEAD -- . ':(exclude)release/20261009-upgrade-sql' ':(exclude)azure-pipelines-upgrade-sql-20261009.yml')"
      test -z "$(git status --porcelain)"
      test -f release/20261009-upgrade-sql/run_upgrade_sql.py
      test -f release/20261009-upgrade-sql/test_upgrade_sql_preparation.py
      python3 -B -m unittest discover -s release/20261009-upgrade -p test_upgrade_preparation.py -v
      python3 -B -m unittest discover -s release/20261009-upgrade-sql -p test_upgrade_sql_preparation.py -v
      python3 -I -B release/20261009-upgrade-sql/run_upgrade_sql.py
    displayName: Refuse incomplete preparation and run no-connect checks
    timeoutInMinutes: 1
  - ${{ if eq(parameters.runRollback, true) }}:
    - task: DotNetCoreCLI@2
      displayName: Reference only the specifically authorized test WIF connection
      timeoutInMinutes: 1
      inputs:
        azureSubscription: 'foodsave-sql-validation-20261008'
        command: custom
        custom: '--version'
        projects: ''
        arguments: ''
      env:
        DOTNET_CLI_TELEMETRY_OPTOUT: '1'
        DOTNET_NOLOGO: '1'
        DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
        DOTNET_CLI_HOME: $(Agent.TempDirectory)/foodsave-upgrade-dotnet
    - bash: |
        set -euo pipefail
        . /etc/os-release
        test "$ID" = ubuntu
        test "$VERSION_ID" = 24.04
        python3 -c 'import sys; assert sys.version_info[:2] == (3, 12)'
        python3 -m venv "$AGENT_TEMPDIRECTORY/foodsave-upgrade-venv"
        "$AGENT_TEMPDIRECTORY/foodsave-upgrade-venv/bin/python" -m pip install --disable-pip-version-check --no-cache-dir --only-binary=:all: -r backend/requirements-test.txt
        if ! "$AGENT_TEMPDIRECTORY/foodsave-upgrade-venv/bin/python" -c 'import pyodbc; raise SystemExit("ODBC Driver 18 for SQL Server" not in pyodbc.drivers())'; then
          curl --fail --silent --show-error --location --connect-timeout 10 --max-time 60 https://packages.microsoft.com/config/ubuntu/24.04/packages-microsoft-prod.deb -o "$AGENT_TEMPDIRECTORY/foodsave-upgrade-microsoft-prod.deb"
          sudo dpkg -i "$AGENT_TEMPDIRECTORY/foodsave-upgrade-microsoft-prod.deb"
          sudo apt-get update -qq
          sudo env ACCEPT_EULA=Y DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends msodbcsql18
        fi
        "$AGENT_TEMPDIRECTORY/foodsave-upgrade-venv/bin/python" -B -m unittest discover -s release/20261009-upgrade -p test_upgrade_preparation.py -v
        "$AGENT_TEMPDIRECTORY/foodsave-upgrade-venv/bin/python" -B -m unittest discover -s release/20261009-upgrade-sql -p test_upgrade_sql_preparation.py -v
      displayName: Install approved test dependencies and repeat offline checks
      timeoutInMinutes: 4
    - bash: |
        set -euo pipefail
        timeout --signal=TERM --kill-after=25s 510s "$AGENT_TEMPDIRECTORY/foodsave-upgrade-venv/bin/python" -I -B release/20261009-upgrade-sql/run_upgrade_sql.py --run-rollback
      displayName: Run one rollback-only synthetic upgrade and fresh cleanup check
      timeoutInMinutes: 9
      env:
        FOODSAVE_UPGRADE_RUN_ROLLBACK: 'true'
        FOODSAVE_WIF_TENANT_ID: '399232fb-17d1-45ca-bda6-5b540441bd62'
        FOODSAVE_WIF_CLIENT_ID: '1424737d-18e2-4e47-acea-9c2d7aa123e7'
        FOODSAVE_WIF_SERVICE_CONNECTION_ID: 'bed364c8-145a-423d-81e4-5af179a9a9f8'
        SYSTEM_ACCESSTOKEN: $(System.AccessToken)
        SYSTEM_OIDCREQUESTURI: $(System.OidcRequestUri)
